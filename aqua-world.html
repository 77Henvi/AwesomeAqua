<!-- ========== AQUA WORLD LDF EDITORIAL EXPERIENCE ========== -->
<main class="aqua-world-main ldf-experience">
  <!-- Immersive Cosmic Atmosphere & Space Glow -->
  <div class="aqua-world-bg-glow"></div>

  <!-- Left Vertical Brand Spine -->
  <div class="ldf-spine-tag" aria-hidden="true">
    <span class="spine-line"></span>
    <span class="spine-text">AQUA WORLD ATLAS — SPECIES & HABITATS</span>
  </div>

  <!-- Left Editorial Discovery Story & Species Panel -->
  <aside class="ldf-editorial-panel" id="speciesPanel">
    <!-- Injected dynamically by scripts/aqua-world.js -->
  </aside>

  <!-- Reopen Floating Pill Button (Visible when panel is closed/minimized) -->
  <button class="ldf-reopen-pill" id="btnReopenHabitatCard" onclick="window.toggleHabitatPanel(true)" title="เปิดดูข้อมูลถิ่นอาศัย / View Habitat Details" aria-label="Open Habitat Card">
    <i class="ph-bold ph-cards"></i>
    <span data-i18n="viewHabitatInfo">ดูข้อมูลถิ่นอาศัย</span>
  </button>

  <!-- Right Side 3D Earth Stage -->
  <div class="ldf-globe-stage">
    <div id="globeViewport" class="aqua-globe-viewport">
      <!-- 3D Three.js Earth Canvas Injected -->
    </div>

    <div class="globe-overlay-hint" id="globeHoverText">
      <i class="ph ph-hand-pointing"></i> <span data-i18n="dragToRotate">ลากเพื่อหมุนลูกโลก · คลิกเลือกทวีป</span>
    </div>
  </div>

  <!-- Bottom Timeline Habitat Scrubber Bar -->
  <div class="ldf-timeline-scrubber" id="habitatScrubber" aria-label="Habitat Scrubber Timeline">
    <!-- Injected dynamically by scripts/aqua-world.js -->
  </div>
</main>


<!-- ========== MODAL รายละเอียดปลา (ใช้ร่วมกับหน้าร้าน) ========== -->
<div class="modal-overlay" id="fishModal" onclick="closeFishModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeFishModal()"><i class="ph ph-x"></i></button>
    <div class="fish-detail-body" id="fishDetailContent"></div>
  </div>
</div>

<script type="module" src="scripts/aqua-world.js"></script>
