<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Awesome Aqua — สั่งซื้อ</title>
  <script src="https://static.line-scdn.net/liff/edge/versions/2.22.3/sdk.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 1.5rem;
    }
    .card {
      background: white; border-radius: 20px;
      padding: 2rem; max-width: 360px; width: 100%;
      box-shadow: 0 8px 32px rgba(26,58,143,0.12);
      text-align: center;
    }
    .logo {
      font-size: 1.4rem; font-weight: 700;
      color: #1a3a8f; margin-bottom: 0.25rem;
    }
    .logo span { color: #2255cc; }
    .fish-img {
      width: 100%; max-height: 200px;
      object-fit: cover; border-radius: 14px;
      margin: 1.25rem 0;
    }
    .fish-emoji {
      font-size: 5rem; display: block;
      margin: 1.25rem 0;
    }
    .fish-name {
      font-size: 1.3rem; font-weight: 700;
      color: #0d0d0d; margin-bottom: 0.25rem;
    }
    .fish-species {
      font-size: 0.82rem; color: #6b7280;
      font-style: italic; margin-bottom: 0.75rem;
    }
    .fish-price {
      font-size: 1.2rem; font-weight: 700;
      color: #1a3a8f; margin-bottom: 0.5rem;
    }
    .fish-stock {
      font-size: 0.85rem; margin-bottom: 1.25rem;
    }
    .btn {
      width: 100%; padding: 0.85rem;
      border-radius: 12px; border: none;
      font-size: 1rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .btn-order {
      background: #06C755; color: white;
      margin-bottom: 0.75rem;
    }
    .btn-back {
      background: #f0f4ff; color: #1a3a8f;
    }
    .status { font-size: 0.82rem; color: #6b7280; margin-top: 1rem; }
    .loading { color: #6b7280; font-size: 0.9rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">Awesome <span>Aqua</span></div>
  <div id="content"><p class="loading">กำลังโหลด...</p></div>
</div>

<script>
const LIFF_ID     = '2010391542-QzHeiSlX';
const SUPABASE_URL = 'https://vfihczafjrkcyncnosgj.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmaWhjemFmanJrY3luY25vc2dqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3NjEzODIsImV4cCI6MjA5MTMzNzM4Mn0.x2XF1GzfAUu_o-l6acRQtl6k6DTY-GsG_JHnEOm-eLA';

// ดึง fish ID จาก URL param
const fishId = new URLSearchParams(location.search).get('fishId');

async function getFish(id) {
  const res  = await fetch(`${SUPABASE_URL}/rest/v1/fish?id=eq.${id}&limit=1`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
  });
  const data = await res.json();
  return data[0] || null;
}

function renderFish(f) {
  const outOfStock = f.stock === 0;
  const priceText  = `฿${f.price_min?.toLocaleString('th-TH') || 0}${f.price_max ? ' – ฿' + f.price_max.toLocaleString('th-TH') : ''}`;
  const stockText  = outOfStock
    ? '❌ หมดสต็อก'
    : f.stock <= 5 ? `⚠️ เหลือ ${f.stock} ตัว` : `✅ มีในสต็อก ${f.stock} ตัว`;

  document.getElementById('content').innerHTML = `
    ${f.image
      ? `<img src="${f.image}" class="fish-img" alt="${f.name}">`
      : `<span class="fish-emoji">${f.emoji || '🐟'}</span>`}
    <div class="fish-name">${f.name}</div>
    <div class="fish-species">${f.species || ''}</div>
    <div class="fish-price">${priceText}</div>
    <div class="fish-stock">${stockText}</div>
    ${!outOfStock
      ? `<button class="btn btn-order" onclick="sendOrder('${f.id}', '${f.name}', '${priceText}')">
           🛒 สั่งซื้อเลย
         </button>`
      : `<button class="btn" style="background:#f3f4f6;color:#9ca3af;cursor:not-allowed" disabled>หมดสต็อก</button>`}
    <button class="btn btn-back" onclick="liff.closeWindow()">← กลับ</button>
    <p class="status" id="status"></p>
  `;
}

async function sendOrder(fishId, fishName, price) {
  const btn = document.querySelector('.btn-order');
  btn.disabled = true;
  btn.textContent = 'กำลังส่ง...';

  try {
    await liff.sendMessages([{
      type: 'text',
      text: `ดูปลา:${fishId}`
    }]);
    document.getElementById('status').textContent = '✅ ส่งข้อมูลแล้ว bot จะตอบกลับทันที';
    setTimeout(() => liff.closeWindow(), 1500);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '🛒 สั่งซื้อเลย';
    document.getElementById('status').textContent = '❌ เกิดข้อผิดพลาด: ' + e.message;
  }
}

// ── Init LIFF ──
(async () => {
  try {
    await liff.init({ liffId: LIFF_ID });

    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }

    if (!fishId) {
      document.getElementById('content').innerHTML =
        '<p style="color:#dc2626">ไม่พบข้อมูลปลา กรุณากลับไปเลือกใหม่</p>';
      return;
    }

    const fish = await getFish(fishId);
    if (!fish) {
      document.getElementById('content').innerHTML =
        '<p style="color:#dc2626">ไม่พบปลาในระบบ</p>';
      return;
    }

    renderFish(fish);
  } catch (e) {
    document.getElementById('content').innerHTML =
      `<p style="color:#dc2626">Error: ${e.message}</p>`;
  }
})();
</script>
</body>
</html>
